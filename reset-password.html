<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password · EcoLearn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Space+Mono:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/auth.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <div class="auth-logo-wrap">
                <img src="imgs/Logo.jpg" alt="EcoLearn Logo" class="auth-logo">
            </div>
            <h1 class="auth-title">Set a New Password</h1>
            <p class="auth-subtitle">Choose a new password for your EcoLearn account.</p>
        </div>

        <form id="resetForm" class="auth-form" novalidate>
            <div class="form-group">
                <label for="passField">New Password</label>
                <div class="input-wrapper">
                    <input type="password" id="passField" placeholder="Enter a new password" autocomplete="new-password" required>
                    <button type="button" class="toggle-pass" id="togglePass" aria-label="Show password">
                        <i class="bi bi-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassField">Confirm Password</label>
                <div class="input-wrapper">
                    <input type="password" id="confirmPassField" placeholder="Re-enter your new password" autocomplete="new-password" required>
                </div>
            </div>

            <button type="submit" class="btn-primary" id="submitBtn">
                Update Password <i class="bi bi-arrow-right"></i>
            </button>
        </form>
    </div>

    <script>
        const togglePass = document.getElementById('togglePass');
        const passField = document.getElementById('passField');
        const eyeIcon = document.getElementById('eyeIcon');

        togglePass.addEventListener('click', () => {
            const show = passField.type === 'password';
            passField.type = show ? 'text' : 'password';
            togglePass.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
            eyeIcon.className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
        });

        // Supabase's JS client automatically reads the recovery token out of
        // the URL fragment the email link lands on and turns it into a
        // temporary session -- that's what authorizes the updateUser() call
        // below. If someone opens this page directly (no token in the URL),
        // there's no recovery session, so warn them instead of showing a
        // form that will just fail.
        (async () => {
            const { data } = await ecoAuth.client.auth.getSession();
            if (!data.session) {
                document.getElementById('resetForm').innerHTML =
                    '<p class="auth-subtitle" style="text-align:center;">This link is invalid or has expired. ' +
                    '<a href="forgot-password.html">Request a new one</a>.</p>';
            }
        })();

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = passField.value;
            const confirmPassword = document.getElementById('confirmPassField').value;

            if (password.length < 6) {
                alert('Password must be at least 6 characters long.');
                return;
            }

            if (password !== confirmPassword) {
                alert('Passwords do not match.');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = 'Updating... <i class="bi bi-hourglass-split"></i>';

            const { error } = await ecoAuth.client.auth.updateUser({ password });

            if (error) {
                alert(error.message || 'Unable to update password. Please try again.');
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Update Password <i class="bi bi-arrow-right"></i>';
                return;
            }

            alert('Password updated! Please sign in with your new password.');
            await ecoAuth.client.auth.signOut();
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
