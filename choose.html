<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>3D-Viewer</title>


    <!-- =========================================
         BOOTSTRAP 5 CSS
    ========================================= -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- =========================================
         BOOTSTRAP ICONS
    ========================================= -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <!-- =========================================
         YOUR CSS
    ========================================= -->

    <link
        rel="stylesheet"
        href="css/sidebar.css"
    >

    <link
        rel="stylesheet"
        href="css/global.css"
    >

    <link
        rel="stylesheet"
        href="css/choose.css"
    >

    <!-- =========================================
         SUPABASE & AUTH
    ========================================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/auth.js"></script>

</head>


<style>

    /* =========================================
       ACTIVE TAB
    ========================================= */

    nav .nav-link.CellModel {

        background-color: #40916C;

        color: #ffffff !important;

        font-weight: 600;

    }

</style>


<body>


    <!-- =========================================
         SIDEBAR
    ========================================= -->

    <nav
        class="d-flex flex-column align-items-center p-3 sidebar-bg"
    >
        
        <img
            src="imgs/Logo.jpg"
            alt="Logo"
            class="rounded-circle logo-img mb-2"
        >


        <h3 class="h5 brand-title mb-4">
            EcoLearn
        </h3>


        <ul class="nav nav-pills flex-column w-100">


            <!-- DASHBOARD -->

            <li class="nav-item mb-1">

                <a
                    class="nav-link Dashboard text-white-50 d-flex align-items-center gap-2"
                    href="dashboard.html"
                >

                    <i class="bi bi-grid-1x2"></i>

                    Dashboard

                </a>

            </li>


            <!-- CELL MODELS -->

            <li class="nav-item mb-1">

                <a
                    class="nav-link CellModel text-white-50 d-flex align-items-center gap-2"
                    href="#"
                >

                    <i class="bi bi-boxes"></i>

                    Cell Models

                </a>

            </li>


            <!-- Lesson -->

            <li class="nav-item mb-1">

                <a
                    class="nav-link Lesson text-white-50 d-flex align-items-center gap-2"
                    href="lesson.html"
                >

                    <i class="bi bi-book"></i>

                    Lesson

                </a>

            </li>

            <!-- QUIZ -->

            <li class="nav-item mb-1">

                <a
                    class="nav-link Quiz text-white-50 d-flex align-items-center gap-2"
                    href="quiz.html"
                >

                    <i class="bi bi-question-circle"></i>

                    Quiz

                </a>

            </li>

            <!-- LOGOUT -->

            <li class="nav-item mt-auto">

                <button
                    id="logoutButton"
                    class="nav-link text-white-50 d-flex align-items-center gap-2 w-100 border-0"
                    style="background: none; cursor: pointer;"
                >

                    <i class="bi bi-box-arrow-right"></i>

                    Logout

                </button>

            </li>

        </ul>

    </nav>



    <!-- =========================================
         MAIN CONTENT
    ========================================= -->

    <div class="ParentCointainerDIV">


        <!-- =====================================
             HEADER
        ====================================== -->

        <div class="HeaderAndSubTDiv">

            <h1>
                3D Cell Explorer
            </h1>

            <p>
                Select a cell type to begin your interactive exploration
            </p>

        </div>



        <!-- =====================================
             CELL CARDS
        ====================================== -->

        <div class="PlantAndAnimalCellContainerDiv">


            <!-- =================================
                 ANIMAL CELL
            ================================== -->

            <div class="AnimalCellBox">

                <img
                    src="imgs/animal-cell.png"
                    alt="Animal Cell"
                >


                <div class="cellBottomBox">

                    <h3>
                        ANIMAL CELL
                    </h3>

                    <p>
                        Animal cell structure
                    </p>


                    <a
                        href="AnimalCell.html"
                        class="exploreButton"
                    >

                        <button
                            type="button"
                        >

                            <span>
                                Explore
                            </span>

                            <i
                                class="bi bi-arrow-right"
                            ></i>

                        </button>

                    </a>

                </div>

            </div>



            <!-- =================================
                 PLANT CELL
            ================================== -->

            <div class="PlantCellBox">

                <img
                    src="imgs/plant-cell.png"
                    alt="Plant Cell"
                >


                <div class="cellBottomBox">

                    <h3>
                        PLANT CELL
                    </h3>

                    <p>
                        Plant cell structure
                    </p>


                    <a
                        href="PlantCell.html"
                        class="exploreButton"
                    >

                        <button
                            type="button"
                        >

                            <span>
                                Explore
                            </span>

                            <i
                                class="bi bi-arrow-right"
                            ></i>

                        </button>

                    </a>

                </div>

            </div>


        </div>

    </div>


    <!-- =========================================
         LOGOUT BUTTON SCRIPT
    ========================================= -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const logoutButton = document.getElementById('logoutButton');
            
            if (logoutButton) {
                logoutButton.addEventListener('click', async () => {
                    await window.ecoAuth.signOut();
                });
            }
        });
    </script>

</body>

</html>
