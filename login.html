<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In · EcoLearn</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/auth.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <img src="imgs/Logo.jpg" alt="EcoLearn Logo" class="auth-logo">
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Sign in to access your cell models, specimen records, and coursework.</p>
        </div>

        <div class="auth-tabs" id="tabs">
            <div class="tab-slider"></div>
            <button type="button" class="tab-btn active" data-role="student" id="tabStudent">
                <i class="bi bi-mortarboard"></i> Student
            </button>
            <button type="button" class="tab-btn" data-role="admin" id="tabAdmin">
                <i class="bi bi-shield-lock"></i> Admin
            </button>
        </div>

        <form id="loginForm" class="auth-form" novalidate>
            <div class="form-group">
                <label for="idField" id="idLabel">Student Email</label>
                <div class="input-wrapper">
                    <input type="email" id="idField" placeholder="you@partido.edu.ph" autocomplete="email" required>
                </div>
            </div>

            <div class="form-group">
                <label for="passField">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="passField" placeholder="Enter your password" autocomplete="current-password" required>
                    <button type="button" class="toggle-pass" id="togglePass" aria-label="Show password">
                        <i class="bi bi-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <div class="auth-links">
                <a href="signup.html">Create account</a>
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit" class="btn-primary" id="submitBtn">
                Sign In <i class="bi bi-arrow-right"></i>
            </button>

            <div class="divider">or</div>

            <button type="button" class="btn-google" id="googleBtn">
                <i class="bi bi-google"></i> Continue with Google
            </button>
        </form>

        <div class="auth-footer">
            © 2026 EcoLearn. All rights reserved.
        </div>
    </div>

    <script>
        const tabs = document.getElementById('tabs');
        const tabStudent = document.getElementById('tabStudent');
        const tabAdmin = document.getElementById('tabAdmin');
        const idLabel = document.getElementById('idLabel');
        const idField = document.getElementById('idField');
        let selectedRole = 'student';

        function setRole(role) {
            selectedRole = role;
            if (role === 'admin') {
                tabs.classList.add('admin');
                tabAdmin.classList.add('active');
                tabStudent.classList.remove('active');
                idLabel.textContent = 'Admin Email';
                idField.placeholder = 'admin@partido.edu.ph';
            } else {
                tabs.classList.remove('admin');
                tabStudent.classList.add('active');
                tabAdmin.classList.remove('active');
                idLabel.textContent = 'Student Email';
                idField.placeholder = 'you@partido.edu.ph';
            }
        }

        tabStudent.addEventListener('click', () => setRole('student'));
        tabAdmin.addEventListener('click', () => setRole('admin'));

        const togglePass = document.getElementById('togglePass');
        const passField = document.getElementById('passField');
        const eyeIcon = document.getElementById('eyeIcon');

        togglePass.addEventListener('click', () => {
            const show = passField.type === 'password';
            passField.type = show ? 'text' : 'password';
            togglePass.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
            eyeIcon.className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const idVal = idField.value.trim();
            const passVal = passField.value;
            
            if (!idVal || !passVal) {
                idField.style.borderColor = !idVal ? '#EF4444' : '';
                passField.style.borderColor = !passVal ? '#EF4444' : '';
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = 'Signing in... <i class="bi bi-hourglass-split"></i>';

            const { data, error } = await ecoAuth.client.auth.signInWithPassword({
                email: idVal,
                password: passVal
            });

            if (error) {
                alert(error.message);
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Sign In <i class="bi bi-arrow-right"></i>';
                return;
            }

            let accountRole;
            try {
                accountRole = await ecoAuth.getRole(data.session);
            } catch (roleError) {
                await ecoAuth.client.auth.signOut();
                alert(roleError.message);
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Sign In <i class="bi bi-arrow-right"></i>';
                return;
            }

            if (accountRole !== selectedRole) {
                await ecoAuth.client.auth.signOut();
                alert(`This account is registered as ${accountRole}. Select the ${accountRole} login to continue.`);
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Sign In <i class="bi bi-arrow-right"></i>';
                return;
            }

            // REDIRECTS TO DASHBOARD FOR STUDENTS, ADMIN.HTML FOR ADMINS
            window.location.replace(accountRole === 'admin' ? 'admin.html' : 'dashboard.html');
        });

        document.getElementById('googleBtn').addEventListener('click', async () => {
            const { error } = await ecoAuth.client.auth.signInWithOAuth({
                provider: 'google',
                options: { 
                    // REDIRECTS TO DASHBOARD AFTER GOOGLE SIGN-IN
                    redirectTo: window.location.origin + window.location.pathname.replace('login.html', 'dashboard.html') 
                }
            });
            if (error) {
                const message = error.message.includes('provider is not enabled')
                    ? 'Google sign-in is not enabled yet. Enable Google under Supabase Authentication > Providers, then try again.'
                    : error.message;
                alert(message);
            }
        });
    </script>
</body>
</html>
