  <main class="quiz-play-main" id="main-content">
    <a class="quiz-play-back" href="quiz.html"><i class="bi bi-arrow-left"></i> Back to Quizzes</a>
    <h1 class="quiz-play-title">Animal Cell vs Plant Cell</h1>
    <p class="quiz-play-subtitle">Get every question right to unlock the Cell Division quiz.</p>

    <div class="quiz-progress-track">
      <div class="quiz-progress-fill" id="quizProgressFill" style="width: 0%;"></div>
    </div>

    <!-- LOADING STATE -->
    <div class="quiz-question-panel" id="quizLoadingPanel">
      <p class="quiz-question-count">Loading questions...</p>
    </div>

    <!-- QUESTION VIEW -->
    <div class="quiz-question-panel" id="quizQuestionPanel" style="display: none;">
      <p class="quiz-question-count" id="quizQuestionCount">Question 1 of 10</p>
      <h2 class="quiz-question-text" id="quizQuestionText"></h2>
      <div class="quiz-options" id="quizOptions"></div>
      <div class="quiz-nav-row">
        <button class="quiz-next-btn" id="quizNextButton" disabled>Next <i class="bi bi-arrow-right"></i></button>
      </div>
    </div>

    <!-- RESULTS VIEW -->
    <div class="quiz-question-panel quiz-results-panel" id="quizResultsPanel" style="display: none;">
      <p class="quiz-results-eyebrow">Your score</p>
      <p class="quiz-results-score" id="quizResultsScore">0 / 10</p>
      <span class="quiz-results-badge" id="quizResultsBadge"></span>
      <p class="quiz-results-note" id="quizResultsNote"></p>
      <div class="quiz-results-actions">
        <button class="retry-btn" id="quizRetryButton" type="button"><i class="bi bi-arrow-repeat"></i> Retry quiz</button>
        <a class="start-btn" href="quiz.html">Back to Quizzes <i class="bi bi-arrow-right"></i></a>
      </div>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const logoutButton = document.getElementById('logoutButton');
      if (logoutButton) {
        logoutButton.addEventListener('click', async () => {
          await window.ecoAuth?.signOut?.();
        });
      }
    });
  </script>

  <!-- =========================================
       QUIZ LOGIC — Supabase version
       100-question bank, 10 random per session
  ========================================= -->
  <script>
    // ── CONFIG ──────────────────────────────────────────────
    const LESSON_ID            = 'e43f6bee-bcff-4692-b5e2-396b4176eacd';
    const QUESTIONS_PER_SESSION = 10;
    const UNLOCK_KEY           = 'ecolearn-quiz-animal-plant-perfect';
    const BEST_SCORE_KEY       = 'ecolearn-quiz-animal-plant-best';

    // ── STATE ────────────────────────────────────────────────
    let sessionQuestions = [];
    let currentIndex     = 0;
    let selectedChoiceId = null;
    let answers          = [];
    let answered         = false;

    // ── ELEMENTS ─────────────────────────────────────────────
    const loadingPanel   = document.getElementById('quizLoadingPanel');
    const questionPanel  = document.getElementById('quizQuestionPanel');
    const resultsPanel   = document.getElementById('quizResultsPanel');
    const questionCountEl= document.getElementById('quizQuestionCount');
    const questionTextEl = document.getElementById('quizQuestionText');
    const optionsEl      = document.getElementById('quizOptions');
    const nextButton     = document.getElementById('quizNextButton');
    const progressFill   = document.getElementById('quizProgressFill');
    const resultsScore   = document.getElementById('quizResultsScore');
    const resultsBadge   = document.getElementById('quizResultsBadge');
    const resultsNote    = document.getElementById('quizResultsNote');
    const retryButton    = document.getElementById('quizRetryButton');

    // ── STEP 1: Load 10 random questions from Supabase ───────
    async function loadQuiz() {
      // Reset UI
      loadingPanel.style.display  = 'block';
      questionPanel.style.display = 'none';
      resultsPanel.style.display  = 'none';
      progressFill.style.width    = '0%';

      // Get supabase client from auth.js
      const client = window.ecoAuth?.client;
      if (!client) {
        loadingPanel.querySelector('p').textContent = 'Auth error. Please refresh.';
        return;
      }

      // 1a. Fetch all question IDs for this lesson
      const { data: allIds, error: idErr } = await client
        .from('questions')
        .select('id')
        .eq('lesson_id', LESSON_ID);

      if (idErr || !allIds || allIds.length === 0) {
        loadingPanel.querySelector('p').textContent = 'Could not load questions. Please try again.';
        console.error(idErr);
        return;
      }

      // 1b. Shuffle and pick 10
      const shuffled  = allIds.sort(() => Math.random() - 0.5);
      const pickedIds = shuffled.slice(0, QUESTIONS_PER_SESSION).map(q => q.id);

      // 1c. Fetch full data for those 10 (question + choices)
      const { data: questions, error: qErr } = await client
        .from('questions')
        .select(`
          id,
          question_text,
          choices (
            id,
            choice_text,
            is_correct
          )
        `)
        .in('id', pickedIds);

      if (qErr || !questions || questions.length === 0) {
        loadingPanel.querySelector('p').textContent = 'Could not load questions. Please try again.';
        console.error(qErr);
        return;
      }

      // Shuffle choices so correct answer isn't always in the same position
      sessionQuestions = questions.map(q => ({
        ...q,
        choices: q.choices.sort(() => Math.random() - 0.5)
      }));

      // Reset state
      currentIndex     = 0;
      selectedChoiceId = null;
      answers          = [];
      answered         = false;

      // Show question panel
      loadingPanel.style.display  = 'none';
      questionPanel.style.display = 'block';
      renderQuestion();
    }

    // ── STEP 2: Render current question ──────────────────────
    function renderQuestion() {
      answered = false;
      nextButton.disabled = true;

      const q = sessionQuestions[currentIndex];

      // Progress label
      questionCountEl.textContent = `Question ${currentIndex + 1} of ${QUESTIONS_PER_SESSION}`;

      // Progress bar
      progressFill.style.width =
        `${((currentIndex + 1) / QUESTIONS_PER_SESSION) * 100}%`;

      // Question text
      questionTextEl.textContent = q.question_text;

      // Render choice buttons
      optionsEl.innerHTML = '';
      q.choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.type      = 'button';
        btn.className = 'quiz-option';
        btn.textContent = choice.choice_text;
        btn.dataset.choiceId  = choice.id;
        btn.dataset.isCorrect = choice.is_correct;
        btn.addEventListener('click', () => handleChoiceSelect(btn));
        optionsEl.appendChild(btn);
      });

      // Next/Submit label
      nextButton.innerHTML =
        currentIndex === QUESTIONS_PER_SESSION - 1
          ? 'See results <i class="bi bi-arrow-right"></i>'
          : 'Next <i class="bi bi-arrow-right"></i>';
    }

    // ── STEP 3: Handle choice selection ──────────────────────
    function handleChoiceSelect(selectedBtn) {
      if (answered) return;

      // Clear previous selection highlight
      optionsEl.querySelectorAll('.quiz-option').forEach(b =>
        b.classList.remove('selected')
      );

      selectedBtn.classList.add('selected');
      selectedChoiceId = selectedBtn.dataset.choiceId;
      nextButton.disabled = false;
    }

    // ── STEP 4: Next / Submit ─────────────────────────────────
    nextButton.addEventListener('click', async () => {
      if (!selectedChoiceId) return;

      answered = true;

      const q              = sessionQuestions[currentIndex];
      const selectedChoice = q.choices.find(c => c.id === selectedChoiceId);

      // Show correct / incorrect feedback on the buttons
      optionsEl.querySelectorAll('.quiz-option').forEach(btn => {
        btn.disabled = true;
        if (btn.dataset.choiceId === selectedChoiceId) {
          btn.classList.add(selectedChoice.is_correct ? 'correct' : 'incorrect');
        }
        if (btn.dataset.isCorrect === 'true') {
          btn.classList.add('correct');
        }
      });

      // Record answer
      answers.push({
        question_id:        q.id,
        selected_choice_id: selectedChoiceId,
        is_correct:         selectedChoice.is_correct
      });

      // Brief pause so student sees the feedback, then advance
      nextButton.disabled = true;
      setTimeout(async () => {
        if (currentIndex < QUESTIONS_PER_SESSION - 1) {
          currentIndex++;
          renderQuestion();
        } else {
          await submitQuiz();
        }
      }, 700);
    });

    // ── STEP 5: Save attempt to Supabase ─────────────────────
    async function submitQuiz() {
      const score  = answers.filter(a => a.is_correct).length;
      const client = window.ecoAuth?.client;

      if (!client) { showResults(score); return; }

      try {
        const { data: { user } } = await client.auth.getUser();
        if (!user) { showResults(score); return; }

        // Insert attempt row
        const { data: attempt, error: attemptErr } = await client
          .from('quiz_attempts')
          .insert({ user_id: user.id, lesson_id: LESSON_ID, score })
          .select()
          .single();

        if (attemptErr || !attempt) {
          console.error('Failed to save attempt:', attemptErr);
          showResults(score);
          return;
        }

        // Insert one detail row per question
        const details = answers.map(a => ({
          attempt_id:         attempt.id,
          question_id:        a.question_id,
          selected_choice_id: a.selected_choice_id,
          is_correct:         a.is_correct
        }));

        const { error: detailsErr } = await client
          .from('quiz_attempt_details')
          .insert(details);

        if (detailsErr) console.error('Failed to save details:', detailsErr);

      } catch (err) {
        console.error('Submit error:', err);
      }

      showResults(score);
    }

    // ── STEP 6: Results screen ────────────────────────────────
    function showResults(score) {
      questionPanel.style.display = 'none';
      resultsPanel.style.display  = 'block';
      progressFill.style.width    = '100%';

      const percentage = Math.round((score / QUESTIONS_PER_SESSION) * 100);
      resultsScore.textContent = `${score} / ${QUESTIONS_PER_SESSION}`;

      // Update best score in localStorage
      const previousBest = Number(localStorage.getItem(BEST_SCORE_KEY) || 0);
      if (percentage > previousBest) {
        localStorage.setItem(BEST_SCORE_KEY, String(percentage));
      }

      if (percentage === 100) {
        localStorage.setItem(UNLOCK_KEY, 'true');
        resultsBadge.className = 'quiz-results-badge perfect';
        resultsBadge.innerHTML = '<i class="bi bi-trophy-fill"></i> Perfect score!';
        resultsNote.textContent = 'Nice work — the Cell Division quiz is now unlocked.';
      } else if (percentage >= 70) {
        resultsBadge.className = 'quiz-results-badge pass';
        resultsBadge.innerHTML = '<i class="bi bi-check-circle-fill"></i> Passed';
        resultsNote.textContent = 'You passed! Get a perfect 10/10 to unlock the Cell Division quiz.';
      } else {
        resultsBadge.className = 'quiz-results-badge fail';
        resultsBadge.innerHTML = '<i class="bi bi-arrow-repeat"></i> Keep practicing';
        resultsNote.textContent = 'Review the lesson and try again — a perfect score unlocks the next quiz.';
      }
    }

    // ── RETRY: shuffle a new set of 10 ───────────────────────
    retryButton.addEventListener('click', () => {
      loadQuiz();
    });

    // ── INIT ─────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', () => {
      loadQuiz();
    });
  </script>
</body>
</html>
