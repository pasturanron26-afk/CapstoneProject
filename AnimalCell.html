    <!-- =========================================
         MAIN GRID
    ========================================= -->

    <div class="parent">


        <!-- =====================================
             3D MODEL VIEWER
        ====================================== -->

        <div class="div1">

            <!-- =================================
                MODE CONTROLS
            ================================== -->
            <div class="modeControls">
                <div class="dropdown">
                    <button class="modeButton dropdown-toggle" type="button" id="modeDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-layers"></i> <span id="modeButtonLabel">Mode: Separate</span>
                    </button>
                    <ul class="dropdown-menu" aria-labelledby="modeDropdown">
                        <li><a class="dropdown-item active" href="#" data-mode="separate">Separate</a></li>
                        <li><a class="dropdown-item" href="#" data-mode="whole">Whole</a></li>
                    </ul>
                </div>
            </div>

            <!-- LOADING SKELETON -->

            <div
                id="modelLoading"
                class="loadingOverlay"
            >


                <!-- ROTATING BOX -->

                <div class="loadingBox">

                    <div class="boxFace boxFront"></div>

                    <div class="boxFace boxBack"></div>

                    <div class="boxFace boxRight"></div>

                    <div class="boxFace boxLeft"></div>

                    <div class="boxFace boxTop"></div>

                    <div class="boxFace boxBottom"></div>

                </div>


                <!-- LOADING BAR -->

                <div class="loadingBarContainer">

                    <div class="loadingBar">

                        <div
                            id="loadingProgress"
                            class="loadingProgress"
                            style="width: 0%;"
                        ></div>

                    </div>


                    <!-- PERCENTAGE -->

                    <div
                        id="loadingPercentage"
                        class="loadingPercentage"
                    >
                        0%
                    </div>

                </div>


                <!-- LOADING TEXT -->

                <p>
                    Loading 3D Animal Cell...
                </p>

            </div>


            <!-- THREE.JS VIEWER -->

            <div id="animalViewer"></div>


            <!-- ZOOM CONTROLS -->

            <div class="zoomControls">

                <button
                    id="resetView"
                    aria-label="Reset 3D model"
                    title="Reset View"
                >
                    <i class="bi bi-arrow-clockwise"></i>
                </button>

                <button
                    id="rotateModel"
                    aria-label="Rotate 3D model"
                    title="Rotate"
                >
                    <i class="bi bi-arrow-repeat"></i>
                </button>

                <button
                    id="zoomIn"
                    aria-label="Zoom in"
                    title="Zoom In"
                >
                    <i class="bi bi-zoom-in"></i>
                </button>

                <button
                    id="zoomOut"
                    aria-label="Zoom out"
                    title="Zoom Out"
                >
                    <i class="bi bi-zoom-out"></i>

            </div>

             RIGHT INFORMATION PANEL
        ====================================== -->

                id="infoLoading"

            >

                <div class="skeleton skeletonTitle"></div>

                <div class="skeleton skeletonText"></div>

                <div class="skeleton skeletonText"></div>

                <div class="skeleton skeletonText short"></div>

            </div>

        <!-- =====================================

            <!-- NAVIGATION SKELETON -->

                    <button

                    <button
                        class="organelleButton"
                        data-organelle="golgiApparatus"
                    >
                        Golgi Apparatus
                    </button>

                    <button
                        class="organelleButton"

                    >
                        Lysosome
                    </button>

                    <button
                        class="organelleButton"
                        data-organelle="mitochondria"
                    >
                        Mitochondria
                    </button>

                    <button

                    </button>

                    <button
                        class="organelleButton"

                    </button>

                    <button
                        class="organelleButton"

                        Peroxisome
                    </button>

                    <button
                        class="organelleButton"

    <!-- =========================================
        BOOTSTRAP 5 JS BUNDLE (Required for Dropdowns)
    ========================================= -->

    <!-- =========================================
         INFORMATION JAVASCRIPT
    ========================================= -->
    <script type="module" src="js/organelleInfo.js"></script> 
    <!-- OR js/organelleInfo.js for AnimalCell.html -->

    <!-- =========================================
         THREE.JS JAVASCRIPT
    ========================================= -->
    <script type="module" src="js/tredii.js"></script> 
    <!-- OR js/tredii.js for AnimalCell.html -->

    <!-- =========================================
        SIDEBAR TOGGLE SCRIPT
    ========================================= -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sidebarToggle = document.getElementById('sidebarToggle');
            const parentGrid = document.querySelector('.parent');
            const toggleIcon = sidebarToggle ? sidebarToggle.querySelector('i') : null;

            if (sidebarToggle && parentGrid && toggleIcon) {
                sidebarToggle.addEventListener('click', () => {
                    parentGrid.classList.toggle('sidebar-collapsed');
                    
                    // Change icon direction based on state
                    if (parentGrid.classList.contains('sidebar-collapsed')) {
                        toggleIcon.classList.remove('bi-chevron-left');
                        toggleIcon.classList.add('bi-chevron-right');
                    } else {
                        toggleIcon.classList.remove('bi-chevron-right');
                        toggleIcon.classList.add('bi-chevron-left');
                    }
                });
            }
        });
    </script>

    <!-- =========================================
        LOGOUT BUTTON SCRIPT
    ========================================= -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const logoutButton = document.getElementById('logoutButton');
            
            if (logoutButton) {
                logoutButton.addEventListener('click', async () => {
                    await window.ecoAuth.signOut();
                });
            }
        });
    </script>

    <!-- =========================================
        ROTATE BUTTON SCRIPT
    ========================================= -->
    <script>
        let isAutoRotating = false;
        let autoRotationSpeed = 0.01;

        document.addEventListener('DOMContentLoaded', () => {
            const rotateButton = document.getElementById('rotateModel');
            
            if (rotateButton) {
                rotateButton.addEventListener('click', () => {
                    isAutoRotating = !isAutoRotating;
                    rotateButton.classList.toggle('active', isAutoRotating);
                    
                    if (isAutoRotating) {
                        rotateButton.style.opacity = '1';
                    } else {
                        rotateButton.style.opacity = '0.6';
                    }
                });
            }
        });

        // Export auto-rotation state for use in tredii.js
        window.modelRotationState = {
            isAutoRotating: () => isAutoRotating,
            getSpeed: () => autoRotationSpeed
        };
    </script>
</body>
