<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up · EcoLearn</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/auth.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <div class="auth-logo-wrap">
                <img src="imgs/Logo.jpg" alt="EcoLearn Logo" class="auth-logo">
            </div>
            <h1 class="auth-title">Create Account</h1>
            <p class="auth-subtitle">Register as a new Biology student and start accessing your learning resources.</p>
        </div>

        <form id="signupForm" class="auth-form" novalidate>
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <div class="input-wrapper">
                    <input type="text" id="fullName" placeholder="Juan Dela Cruz" autocomplete="name" required>
                </div>
            </div>

            <div class="form-group">
                <label for="emailField">Student Email</label>
                <div class="input-wrapper">
                    <input type="email" id="emailField" placeholder="you@partido.edu.ph" autocomplete="email" required>
                </div>
            </div>

            <div class="form-group">
                <label for="passField">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="passField" placeholder="Create a password" autocomplete="new-password" required>
                    <button type="button" class="toggle-pass" id="togglePass" aria-label="Show password">
                        <i class="bi bi-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassField">Confirm Password</label>
                <div class="input-wrapper">
                    <input type="password" id="confirmPassField" placeholder="Re-enter your password" autocomplete="new-password" required>
                </div>
            </div>

            <div class="auth-links">
                <a href="login.html">Already have an account? Sign in</a>
            </div>

            <button type="submit" class="btn-primary" id="submitBtn">
                Create Account <i class="bi bi-arrow-right"></i>
            </button>
        </form>
    </div>

    <script>
        const togglePass = document.getElementById('togglePass');
        const passField = document.getElementById('passField');
        const eyeIcon = document.getElementById('eyeIcon');

        togglePass.addEventListener('click', () => {
            const show = passField.type === 'password';
            passField.type = show ? 'text' : 'password';
            togglePass.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
            eyeIcon.className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
        });

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('emailField').value.trim();
            const password = passField.value;
            const confirmPassword = document.getElementById('confirmPassField').value;

            if (!fullName || !email || !password || !confirmPassword) {
                alert('Please complete all fields.');
                return;
            }

            if (password.length < 6) {
                alert('Password must be at least 6 characters long.');
                return;
            }

            if (password !== confirmPassword) {
                alert('Passwords do not match.');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = 'Creating account... <i class="bi bi-hourglass-split"></i>';

            try {
                const { data, error } = await ecoAuth.client.auth.signUp({
                    email,
                    password,
                    options: {
                        data: {
                            full_name: fullName,
                            role: 'student'
                        }
                    }
                });

                if (error) throw error;

                const userId = data?.user?.id;
                if (userId) {
                    await ecoAuth.client.from('profiles').upsert({
                        id: userId,
                        email,
                        full_name: fullName,
                        role: 'student',
                        created_at: new Date().toISOString()
                    }, { onConflict: 'id' });
                }

                alert('Account created successfully! Welcome to EcoLearn.');
                window.location.href = 'dashboard.html'; // REDIRECTS TO DASHBOARD
            } catch (error) {
                alert(error.message || 'Unable to create account. Please try again.');
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Create Account <i class="bi bi-arrow-right"></i>';
            }
        });
    </script>
</body>
</html>
