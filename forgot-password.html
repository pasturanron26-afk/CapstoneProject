<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password · EcoLearn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Space+Mono:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/auth.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <div class="auth-logo-wrap">
                <img src="imgs/Logo.jpg" alt="EcoLearn Logo" class="auth-logo">
            </div>
            <h1 class="auth-title">Reset Your Password</h1>
            <p class="auth-subtitle">Enter the email on your account and we'll send you a link to set a new password.</p>
        </div>

        <form id="forgotForm" class="auth-form" novalidate>
            <div class="form-group">
                <label for="emailField">Email</label>
                <div class="input-wrapper">
                    <input type="email" id="emailField" placeholder="you@partido.edu.ph" autocomplete="email" required>
                </div>
            </div>

            <button type="submit" class="btn-primary" id="submitBtn">
                Send Reset Link <i class="bi bi-arrow-right"></i>
            </button>

            <div class="auth-links">
                <a href="login.html">Back to sign in</a>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('emailField').value.trim();
            if (!email) return;

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = 'Sending... <i class="bi bi-hourglass-split"></i>';

            // redirectTo must be added to Supabase's allowed Redirect URLs
            // (Authentication > URL Configuration) or the link in the email
            // will fail to redirect back here.
            const redirectTo = window.location.origin + window.location.pathname.replace('forgot-password.html', 'reset-password.html');

            const { error } = await ecoAuth.client.auth.resetPasswordForEmail(email, { redirectTo });

            // Always show the same success message whether or not the email
            // exists in the system -- this avoids leaking which emails are
            // registered (a common account-enumeration mistake).
            alert('If an account exists for that email, a reset link has been sent.');

            if (error) {
                console.error('resetPasswordForEmail error:', error.message);
            }

            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
